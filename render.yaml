services:
  - type: web
    name: cropguardian-ai
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: cropguardian-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        value: sqlite:////var/data/cropguardian.db
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: lax
      - key: AUTH_REMEMBER_DAYS
        value: "30"
      - key: AUTH_TOKEN_HOURS
        value: "12"
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://cropguardian-ai-1.onrender.com

  - type: web
    name: cropguardian-ai-1
    runtime: static
    buildCommand: mkdir -p dist && cp index.html dist/ && cp -r css js data dist/
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 24.19.0