<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="api-base-url" content="https://cropguardian-ai.onrender.com">
  <script>
    window.CROPGUARDIAN_API_BASE = ["localhost", "127.0.0.1"].includes(location.hostname)
      ? "http://127.0.0.1:8001"
      : "https://cropguardian-ai.onrender.com";
  </script>
  <title data-i18n-title="pageTitleLogin">Sign In | CropGuardian AI</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body class="auth-page">
  <main class="auth-main">
    <section class="auth-card glass-card" aria-labelledby="loginHeading">
      <label class="language-control auth-language-control" for="languageSelect"><span class="sr-only" data-i18n="languageLabel">Language</span><select id="languageSelect" data-language-select aria-label="Select language"><option value="en">English</option><option value="te">తెలుగు</option><option value="hi">हिन्दी</option></select></label>
      <a class="brand-logo auth-brand" href="index.html">
        <span class="brand-icon-wrap" aria-hidden="true">CG</span>
        <span>CropGuardian <span class="text-lime">AI</span></span>
      </a>
      <p class="card-kicker">Your farm workspace</p>
      <h1 id="loginHeading">Welcome back</h1>
      <p class="auth-description">Sign in to access your saved crop history and assistant conversations.</p>
      <form id="loginForm" class="auth-form">
        <div class="auth-field">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" class="text-input" name="email" type="email" autocomplete="email" required maxlength="254">
        </div>
        <div class="auth-field">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" class="text-input" name="password" type="password" autocomplete="current-password" required maxlength="72">
        </div>
        <label class="auth-checkbox"><input name="rememberMe" type="checkbox"><span>Remember me on this device</span></label>
        <button class="btn btn-primary" type="submit">Sign in</button>
        <p class="form-status auth-status" role="status" aria-live="polite"></p>
      </form>
      <p class="auth-switch">New to CropGuardian? <a href="signup.html">Create an account</a></p>
      <a class="auth-back-link" href="index.html">Continue without signing in</a>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
