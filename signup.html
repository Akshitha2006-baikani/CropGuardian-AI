<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="api-base-url" content="https://cropguardian-ai.onrender.com">
  <script>
    window.CROPGUARDIAN_API_BASE = ["localhost", "127.0.0.1"].includes(location.hostname)
      ? "http://127.0.0.1:8001"
      : "https://cropguardian-ai.onrender.com";
  </script>
  <title data-i18n-title="pageTitleSignup">Create Account | CropGuardian AI</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body class="auth-page">
  <main class="auth-main">
    <section class="auth-card glass-card" aria-labelledby="signupHeading">
      <label class="language-control auth-language-control" for="languageSelect"><span class="sr-only" data-i18n="languageLabel">Language</span><select id="languageSelect" data-language-select aria-label="Select language"><option value="en">English</option><option value="te">తెలుగు</option><option value="hi">हिन्दी</option></select></label>
      <a class="brand-logo auth-brand" href="index.html">
        <span class="brand-icon-wrap" aria-hidden="true">CG</span>
        <span>CropGuardian <span class="text-lime">AI</span></span>
      </a>
      <p class="card-kicker">A safer place for your records</p>
      <h1 id="signupHeading">Create your account</h1>
      <p class="auth-description">Save crop analyses, chat history, and your preferred language across sessions.</p>
      <form id="signupForm" class="auth-form">
        <div class="auth-field">
          <label for="signupName">Your name</label>
          <input id="signupName" class="text-input" name="name" autocomplete="name" required minlength="1" maxlength="100">
        </div>
        <div class="auth-field">
          <label for="signupEmail">Email</label>
          <input id="signupEmail" class="text-input" name="email" type="email" autocomplete="email" required maxlength="254">
        </div>
        <div class="auth-field">
          <label for="signupPassword">Password</label>
          <input id="signupPassword" class="text-input" name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="72" aria-describedby="passwordHint">
          <small id="passwordHint">Use at least 10 characters.</small>
        </div>
        <div class="auth-field">
          <label for="signupPasswordConfirm">Confirm Password</label>
          <input id="signupPasswordConfirm" class="text-input" name="passwordConfirm" type="password" autocomplete="new-password" required minlength="10" maxlength="72">
        </div>
        <button class="btn btn-primary" type="submit">Create account</button>
        <p class="form-status auth-status" role="status" aria-live="polite"></p>
      </form>
      <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
      <a class="auth-back-link" href="index.html">Continue without signing in</a>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
